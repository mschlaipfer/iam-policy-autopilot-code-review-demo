name: IAM Policy Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  iam-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install iam-policy-autopilot
        run: |
          curl -sSL https://github.com/mschlaipfer/iam-policy-autopilot/releases/download/0.2.1-gh-tool-demo/iam-policy-autopilot-0.2.1-gh-tool-demo-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv iam-policy-autopilot /usr/local/bin/

      - name: Fetch base and head files
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD | while read f; do
            mkdir -p /tmp/base/$(dirname "$f") /tmp/head/$(dirname "$f")
            git show origin/${{ github.base_ref }}:"$f" > /tmp/base/"$f" 2>/dev/null || true
            git show HEAD:"$f" > /tmp/head/"$f" 2>/dev/null || true
          done
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

      - name: Build file args
        id: build_args
        shell: bash
        run: |
          BASE_ARGS=""
          HEAD_ARGS=""
          while read f; do
            ext="${f##*.}"
            case "$ext" in py|js|ts|go)
              [ -f /tmp/base/"$f" ] && BASE_ARGS="$BASE_ARGS --base-file $f:/tmp/base/$f"
              [ -f /tmp/head/"$f" ] && HEAD_ARGS="$HEAD_ARGS --head-file $f:/tmp/head/$f"
              ;;
            esac
          done < <(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "base_args=$BASE_ARGS" >> $GITHUB_OUTPUT
          echo "head_args=$HEAD_ARGS" >> $GITHUB_OUTPUT

      - name: Review lambda1
        id: review_lambda1
        run: |
          REVIEW=$(iam-policy-autopilot generate-review \
            ${{ steps.build_args.outputs.base_args }} \
            ${{ steps.build_args.outputs.head_args }} \
            --diff /tmp/pr.diff \
            --filter 'src/lambda1/**' \
            --existing-policy policies/lambda1-policy.json \
            --policy-path policies/lambda1-policy.json \
            --include-tool-link)
          echo "json<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Review lambda2
        id: review_lambda2
        run: |
          REVIEW=$(iam-policy-autopilot generate-review \
            ${{ steps.build_args.outputs.base_args }} \
            ${{ steps.build_args.outputs.head_args }} \
            --diff /tmp/pr.diff \
            --filter 'src/lambda2/**' \
            --existing-policy policies/lambda2-policy.json \
            --policy-path policies/lambda2-policy.json \
            --include-tool-link)
          echo "json<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post reviews
        uses: actions/github-script@v7
        env:
          REVIEW_LAMBDA1: ${{ steps.review_lambda1.outputs.json }}
          REVIEW_LAMBDA2: ${{ steps.review_lambda2.outputs.json }}
        with:
          script: |
            for (const env of ['REVIEW_LAMBDA1', 'REVIEW_LAMBDA2']) {
              const review = JSON.parse(process.env[env]);
              if (review.comments.length === 0) continue;
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  commit_id: context.payload.pull_request.head.sha,
                  body: review.body,
                  event: 'COMMENT',
                  comments: review.comments.map(c => ({
                    path: c.path,
                    line: c.line,
                    side: c.side,
                    body: c.body,
                  })),
                });
              } catch (err) {
                core.warning(`Failed to post review: ${err.message}`);
              }
            }
