name: IAM Policy Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  iam-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    env:
      GITHUB_BLOB_URL_PREFIX: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install iam-policy-autopilot
        run: |
          curl -sSL https://github.com/mschlaipfer/iam-policy-autopilot/releases/download/0.2.1-gh-tool-demo/iam-policy-autopilot-0.2.1-gh-tool-demo-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv iam-policy-autopilot /usr/local/bin/

      - name: Fetch base and head files
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...HEAD | while read f; do
            mkdir -p /tmp/base/$(dirname "$f") /tmp/head/$(dirname "$f")
            git show origin/${{ github.base_ref }}:"$f" > /tmp/base/"$f" 2>/dev/null || true
            git show HEAD:"$f" > /tmp/head/"$f" 2>/dev/null || true
          done
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

      - name: Build file args
        id: build_args
        shell: bash
        run: |
          BASE_ARGS=""
          HEAD_ARGS=""
          # Include changed source files
          while read f; do
            ext="${f##*.}"
            case "$ext" in py|js|ts|go)
              [ -f /tmp/base/"$f" ] && BASE_ARGS="$BASE_ARGS --base-file $f:/tmp/base/$f"
              [ -f /tmp/head/"$f" ] && HEAD_ARGS="$HEAD_ARGS --head-file $f:/tmp/head/$f"
              ;;
            esac
          done < <(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          # If policy changed but no source files are in the diff,
          # include all repo source files so regression detection works
          if [ -z "$HEAD_ARGS" ] && git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "policy.json"; then
            while read f; do
              HEAD_ARGS="$HEAD_ARGS --head-file $f:$f"
              git show origin/${{ github.base_ref }}:"$f" > /tmp/base/"$f" 2>/dev/null && \
                BASE_ARGS="$BASE_ARGS --base-file $f:/tmp/base/$f"
            done < <(find . -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.go' | sed 's|^\./||')
          fi
          echo "base_args=$BASE_ARGS" >> $GITHUB_OUTPUT
          echo "head_args=$HEAD_ARGS" >> $GITHUB_OUTPUT

      - name: Generate IAM review
        id: iam_review
        shell: bash
        run: |
          BASE_POLICY_ARG=""
          if [ -f /tmp/base/policy.json ]; then
            BASE_POLICY_ARG="--base-policy /tmp/base/policy.json"
          fi
          REVIEW=$(iam-policy-autopilot generate-review \
            ${{ steps.build_args.outputs.base_args }} \
            ${{ steps.build_args.outputs.head_args }} \
            --diff /tmp/pr.diff \
            --existing-policy policy.json \
            --policy-path policy.json \
            --include-tool-link \
            --suggest-policy-changes \
            $BASE_POLICY_ARG)
          echo "json<<EOF" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post review
        uses: actions/github-script@v7
        env:
          REVIEW_JSON: ${{ steps.iam_review.outputs.json }}
        with:
          script: |
            const review = JSON.parse(process.env.REVIEW_JSON);
            if (review.comments.length === 0 && !review.body) return;
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              commit_id: context.payload.pull_request.head.sha,
              body: review.body,
              event: 'COMMENT',
            };
            if (review.comments.length > 0) {
              params.comments = review.comments.map(c => ({
                path: c.path,
                line: c.line,
                side: c.side,
                body: c.body,
              }));
            }
            await github.rest.pulls.createReview(params);
