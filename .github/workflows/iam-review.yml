name: IAM Policy Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  iam-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install iam-policy-autopilot
        run: |
          curl -sSL https://github.com/mschlaipfer/iam-policy-autopilot/releases/download/0.1.4-gh-tool-demo/iam-policy-autopilot-0.1.4-gh-tool-demo-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv iam-policy-autopilot /usr/local/bin/

      - name: Fetch base and head files
        run: |
          git fetch origin ${{ github.base_ref }}
          # For each changed .py/.ts/.js/.go file, save base and head versions
          git diff --name-only origin/${{ github.base_ref }}...HEAD | while read f; do
            mkdir -p /tmp/base/$(dirname "$f") /tmp/head/$(dirname "$f")
            git show origin/${{ github.base_ref }}:"$f" > /tmp/base/"$f" 2>/dev/null || true
            git show HEAD:"$f" > /tmp/head/"$f" 2>/dev/null || true
          done
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

      - name: Build --base-file and --head-file args
        id: build_args
        run: |
          BASE_ARGS=""
          HEAD_ARGS=""
          git diff --name-only origin/${{ github.base_ref }}...HEAD | while read f; do
            ext="${f##*.}"
            case "$ext" in py|js|ts|go)
              [ -f /tmp/base/"$f" ] && BASE_ARGS="$BASE_ARGS --base-file $f:/tmp/base/$f"
              [ -f /tmp/head/"$f" ] && HEAD_ARGS="$HEAD_ARGS --head-file $f:/tmp/head/$f"
              ;;
            esac
          done
          echo "base_args=$BASE_ARGS" >> $GITHUB_OUTPUT
          echo "head_args=$HEAD_ARGS" >> $GITHUB_OUTPUT

      - name: Generate IAM review comments
        id: iam_review
        run: |
          COMMENTS=$(iam-policy-autopilot generate-review \
            ${{ steps.build_args.outputs.base_args }} \
            ${{ steps.build_args.outputs.head_args }} \
            --diff /tmp/pr.diff \
            --pretty)
          echo "comments<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post review comments
        uses: actions/github-script@v7
        with:
          script: |
            const comments = JSON.parse(`${{ steps.iam_review.outputs.comments }}`);
            for (const comment of comments) {
              await github.rest.pulls.createReviewComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                commit_id: context.payload.pull_request.head.sha,
                path: comment.path,
                line: comment.line,
                body: comment.body,
              });
            }
